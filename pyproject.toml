[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-vobiz"
version = "0.0.1"
description = "Vobiz telephony integration for Pipecat"
readme = "README.md"
authors = [
    { name = "Piyush Sahoo" }
]
license = { text = "BSD-2-Clause" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pipecat-ai>=0.0.80",
    "aiohttp>=3.8.0",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/Piyush-sahoo/Pipecat-Vobiz"
Repository = "https://github.com/Piyush-sahoo/Pipecat-Vobiz"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat"]
